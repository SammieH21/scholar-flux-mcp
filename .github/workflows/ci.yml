name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      # Accesses the hostnames via the names of the containers
      SCHOLAR_FLUX_REDIS_HOST: localhost
      SCHOLAR_FLUX_REDIS_PORT: 6380
      SCHOLAR_FLUX_DEFAULT_RESPONSE_CACHE_STORAGE: redis

    services:
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install tox
        run: poetry run pip install tox tox-gh-actions

      - name: Run tests with tox
        run: poetry run tox
      
      # Generate coverage for this Python version
      - name: Generate coverage report
        run: poetry run tox -e coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
